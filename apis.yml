aid: homebot
name: Homebot
description: >-
  Homebot is a homeownership platform that helps loan officers, real estate agents, banks,
  and credit unions engage clients with personalized home-finance insights and behavioral
  intelligence. It sends automated monthly digests covering home value, equity, and buying
  power, and surfaces high-intent "Motivated Client Alerts" so professionals can reach the
  right client at the right time. Homebot's Open API exposes 60+ client-activity events and
  equity/intent signals, and it integrates with CRMs (Salesforce, Total Expert, Follow Up
  Boss, Sierra Interactive), video (BombBomb), and automation (Zapier) to drive retention,
  referrals, and repeat business. The platform serves 10,000+ customers and 13 million
  homeowners. Backed by 500 Global.
